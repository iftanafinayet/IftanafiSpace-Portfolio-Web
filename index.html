<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logoweb.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="Portfolio Personal Nayet Iftanafi — Full Stack Developer yang berbasis di Jakarta, Indonesia. MERN stack, scalable web applications, & custom digital solutions." />
    <title>IftanafiSpace — Nayet Iftanafi | Full Stack Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #fafafa;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: 'Poppins', sans-serif;
      }
      #splash .brand {
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -0.02em;
        color: #000;
      }
      #splash .tag {
        font-family: 'Geist Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: rgba(0, 0, 0, 0.5);
      }
      #splash .bar {
        width: 120px;
        height: 2px;
        margin-top: 4px;
        background: rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      #splash .bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #000;
        animation: splashmove 0.9s infinite linear;
      }
      @keyframes splashmove {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="brand">NAYET IFTANAFI</div>
        <div class="tag">Full Stack Developer</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
